<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaši Rezultati - GlasoMetar</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="header">Vaš Politički Profil</div>
    
    <div class="container" id="capture-area">
        
        <!-- OVDJE JE BILA GREŠKA: Nedostajao je ovaj div za 8values trake -->
        <h2 class="section-title">1. Vaše političke osi (8values)</h2>
        <div id="axes-container"></div>

        <h2 class="section-title">2. Vaša pozicija na političkom kompasu</h2>
        <div class="chart-container">
            <canvas id="compassChart"></canvas>
        </div>

        <h2 class="section-title">3. Stranke koje Vam programski odgovaraju</h2>
        <div id="results-list"></div>

        <h2 class="section-title">4. Vaši "spiritualni" političari</h2>
        <div id="individuals-list"></div>
        
        <button class="btn-share" onclick="downloadImage()">📸 Preuzmi za Instagram / Story</button>
    </div>
    
    <script src="js/rezultati.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        function downloadImage() {
            document.querySelector('.btn-share').style.display = 'none';
            const detailsElements = document.querySelectorAll('details');
            detailsElements.forEach(d => d.removeAttribute('open'));

            html2canvas(document.getElementById("capture-area"), {
                backgroundColor: "#f4f7f6",
                scale: 2 
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = 'Moj_Izborni_Profil_BiH.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                document.querySelector('.btn-share').style.display = 'block';
            });
        }
    </script>
</body>
</html>
